# Publish a GitHub release when a version tag (v1.2.3) is pushed, using that
# version's section of CHANGELOG.md as the release notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(cat VERSION)" != "$version" ]; then
            echo "::error::VERSION says $(cat VERSION), but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "codehive $VERSION" --notes-file notes.md
